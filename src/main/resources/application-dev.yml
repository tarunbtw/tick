spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tick_db
    username: tick_user
    password: tick_pass

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.tick.market: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
