version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tick_db
      POSTGRES_USER: tick_user
      POSTGRES_PASSWORD: tick_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tick_user -d tick_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
